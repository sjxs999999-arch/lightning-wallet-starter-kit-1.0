name: Production CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: lightning-wallet-starter-kit-1.0
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lightning-wallet-starter-kit-1.0/package-lock.json
      - run: npm ci --ignore-scripts --registry=https://registry.npmjs.org
      - run: ./scripts/check-secrets.sh
      - run: ./scripts/test-deploy-disk.sh
      - run: ./scripts/test-production-env.sh
      - run: ./scripts/test-promote-release.sh
      - run: ./scripts/test-verification-gates.sh
      - run: ./scripts/test-rollback-release.sh
      - run: ./scripts/test-live-providers.sh
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Reject high or critical production advisories
        run: npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: lightning-wallet-starter-kit-1.0
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build API image
        run: docker build --file docker/api.Dockerfile --tag lightning-wallet-api:${{ github.sha }} .
      - name: Build web image with fail-closed testnet defaults
        run: docker build --file docker/web.Dockerfile --tag lightning-wallet-web:${{ github.sha }} .
