name: CI
on:
  push:
    branches: [stable/v1.0-deploy, "feature/**"]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    defaults: { run: { working-directory: lightning-wallet-starter-kit-1.0 } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: lightning-wallet-starter-kit-1.0/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=critical
      - run: docker compose build api web
  secrets:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
