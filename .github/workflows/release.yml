name: Stable Release Verification

on:
  push:
    tags:
      - 'stable-*'

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: lightning-wallet-starter-kit-1.0
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lightning-wallet-starter-kit-1.0/package-lock.json
      - run: npm ci --ignore-scripts --registry=https://registry.npmjs.org
      - run: ./scripts/check-secrets.sh
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org
      - name: Package immutable source release
        working-directory: .
        run: git archive --format=tar.gz --output=lightning-wallet-${GITHUB_REF_NAME}.tar.gz HEAD:lightning-wallet-starter-kit-1.0
      - uses: actions/upload-artifact@v6
        with:
          name: lightning-wallet-${{ github.ref_name }}
          path: lightning-wallet-${{ github.ref_name }}.tar.gz
          if-no-files-found: error
          retention-days: 30
