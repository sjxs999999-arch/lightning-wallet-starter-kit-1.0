limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s; upstream web { server web:4173; } upstream api { server api:3001; } server { listen 80; server_name ${DOMAIN}; location /.well-known/acme-challenge/ { root /var/www/certbot; } location / { return 301 https://$host$request_uri; } } server { listen 443 ssl http2; server_name ${DOMAIN}; server_tokens off; ssl_certificate /etc/letsencrypt/live/${DOMAIN}/fullchain.pem; ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem; ssl_protocols TLSv1.2 TLSv1.3; ssl_session_cache shared:SSL:10m; add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always; location /api/ { limit_req zone=api burst=40 nodelay; proxy_pass http://api; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Request-ID $request_id; proxy_read_timeout 30s; } location ~ ^/(health|metrics) { proxy_pass http://api; } location / { proxy_pass http://web; proxy_set_header Host $host; } }
