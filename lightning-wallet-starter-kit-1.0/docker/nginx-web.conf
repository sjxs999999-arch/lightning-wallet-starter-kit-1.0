server { listen 4173; server_name _; root /usr/share/nginx/html; index index.html; server_tokens off; add_header Content-Security-Policy "default-src 'self'; connect-src 'self' http://localhost:3001 https://*.walletconnect.com https://*.walletconnect.org wss://*.walletconnect.com wss://*.walletconnect.org https://*.publicnode.com https://api.devnet.solana.com https://*.trongrid.io; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always; add_header X-Content-Type-Options nosniff always; add_header Referrer-Policy strict-origin-when-cross-origin always; location = /healthz { access_log off; default_type text/plain; return 200 'ok'; } location /assets/ { try_files $uri =404; expires 1y; } location / { try_files $uri $uri/ /index.html; expires -1; } }
