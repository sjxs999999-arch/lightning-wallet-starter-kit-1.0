services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: lightning, POSTGRES_PASSWORD: lightning_dev, POSTGRES_DB: lightning_wallet }
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data", "./database/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U lightning -d lightning_wallet"], interval: 5s, timeout: 3s, retries: 10 }
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports: ["6379:6379"]
    volumes: ["redis_data:/data"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 10 }
  api:
    build: { context: ., dockerfile: docker/api.Dockerfile }
    env_file: .env
    environment: { DATABASE_URL: postgresql://lightning:lightning_dev@postgres:5432/lightning_wallet, REDIS_URL: redis://redis:6379 }
    ports: ["3001:3001"]
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_healthy } }
  web:
    build: { context: ., dockerfile: docker/web.Dockerfile, args: { VITE_API_URL: http://localhost:3001/api/v1 } }
    ports: ["4173:4173"]
    depends_on: [api]
volumes: { postgres_data: {}, redis_data: {} }
